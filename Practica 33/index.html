<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="css/estilos.css" rel="stylesheet"> 
    <title>Maratón</title>
</head>
<body>
    <form id="ingresarDatos">
        <div class="campos">
        <legend>Datos del corredor</legend>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido">

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad">

        <label for="numero">Numero de participante:</label>
        <input type="number" id="numero" name="numero">

        <label for="tiempo">Tiempo tardado:</label>
        <input type="tiempo" id="tiempo" name="tiempo">

        <button type="button" id="boton">Enviar</button>
        </div>
    </form>
    <ul class="listado">
        
    </ul>
    <script src="js/script.js"></script>
</body>
</html>
